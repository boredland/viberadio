<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08011c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A shared radio for your Slack channel: every YouTube link posted becomes a track everyone hears in sync." />
    <meta name="slack-app-id" content="A0CGCJKBB0T" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="viberadio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>viberadio</title>
    <script>
      // Runs before the stylesheet paints, so a saved theme never flashes the default colours first. Anything unknown is
      // ignored here, and theme.ts validates the same values again when the app loads.
      try {
        var t = localStorage.getItem("viberadio:theme");
        var b = localStorage.getItem("viberadio:bg");
        if (/^(phosphor|ice|hotpink|violet|mono)$/.test(t)) document.documentElement.dataset.theme = t;
        if (/^(sunset|matrix|night|plain)$/.test(b)) document.documentElement.dataset.bg = b;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
